services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: course_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/lms_db?schema=public
      - JWT_SECRET=dev_jwt_secret_key_123
      - JWT_REFRESH_SECRET=dev_jwt_refresh_secret_key_123
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: course_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
